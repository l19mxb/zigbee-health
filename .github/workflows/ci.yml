name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Build container
        run: docker build -t zigbee-health:ci .
      - name: Smoke-test container with isolated simulation
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs zigbee-health-ci; docker rm -f zigbee-health-ci' EXIT
          docker run -d --name zigbee-health-ci --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp --tmpfs /app/data:uid=1000,gid=1000 -e APP_PASSWORD=ci-only-synthetic-password -p 127.0.0.1:18920:8080 zigbee-health:ci node server/index.mjs --demo
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18920/api/health > health.json; then
              node -e "const h=require('./health.json');if(h.status!=='ready'||h.mode!=='simulation'||h.mqttPublications!==0)process.exit(1)"
              exit 0
            fi
            sleep 1
          done
          exit 1
